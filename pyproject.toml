[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-context"
version = "1.0.0"
description = "ARC (Agent Reasoning Context) — portable, verifiable context packaging for AI agents"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Patryk Juniszewski" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/PJuniszewski/agent-archive"
Repository = "https://github.com/PJuniszewski/agent-archive"
Issues = "https://github.com/PJuniszewski/agent-archive/issues"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "bert-score>=0.3",
]
eval = [
    "ragas>=0.4",
    "anthropic>=0.40",
    "instructor",
    "sentence-transformers>=2.2",
]
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests requiring ML dependencies (sentence-transformers, bert-score)",
    "llm: tests requiring LLM judge (anthropic SDK + ANTHROPIC_API_KEY)",
    "eval: tests requiring RAGAS evaluation (pip install arc-context[eval] + ANTHROPIC_API_KEY)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E741",  # ambiguous variable name (l, I) — used in short loops
]

[tool.ruff.lint.per-file-ignores]
"src/arc/__init__.py" = ["E402", "F401"]
"src/arc/builder.py" = ["E402"]
"src/arc/loader.py" = ["E402"]
"src/arc/extractor.py" = ["E501"]
"scripts/*" = ["E501"]
"tests/*" = ["F401", "F841", "E501"]

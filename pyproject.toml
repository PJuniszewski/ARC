[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-archive"
version = "0.1.0"
description = "Portable, verifiable, semantic archives for AI agents"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "bert-score>=0.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ml: tests requiring ML dependencies (sentence-transformers, bert-score)",
]

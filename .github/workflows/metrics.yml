name: Metrics

on:
  push:
    branches: [prod, main]

jobs:
  metrics:
    name: Test metrics & report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with metrics
        run: |
          mkdir -p reports
          pytest tests/ -x -q \
            --ignore=tests/test_external_retrieval.py \
            --ignore=tests/test_fidelity_metrics.py \
            -m "not ml and not llm and not eval" \
            --tb=short \
            --junit-xml=reports/test-results.xml \
            2>&1 | tee reports/test-output.txt

      - name: Extract metrics
        if: always()
        run: |
          mkdir -p reports
          python -c "
          import xml.etree.ElementTree as ET, json, sys

          tree = ET.parse('reports/test-results.xml')
          root = tree.getroot()
          suite = root.find('.//testsuite') or root

          metrics = {
              'tests': int(suite.get('tests', 0)),
              'passed': int(suite.get('tests', 0)) - int(suite.get('failures', 0)) - int(suite.get('errors', 0)),
              'failures': int(suite.get('failures', 0)),
              'errors': int(suite.get('errors', 0)),
              'skipped': int(suite.get('skipped', 0)),
              'duration_s': round(float(suite.get('time', 0)), 2),
          }
          metrics['pass_rate'] = round(metrics['passed'] / metrics['tests'] * 100, 1) if metrics['tests'] > 0 else 0

          print(json.dumps(metrics, indent=2))
          with open('reports/metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics
          path: reports/

      - name: Post metrics summary
        if: always()
        run: |
          python -c "
          import json
          m = json.load(open('reports/metrics.json'))
          summary = f'''## Test Metrics

          | Metric | Value |
          |--------|-------|
          | Total tests | {m['tests']} |
          | Passed | {m['passed']} |
          | Failed | {m['failures']} |
          | Errors | {m['errors']} |
          | Pass rate | {m['pass_rate']}% |
          | Duration | {m['duration_s']}s |
          '''
          print(summary)
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write(summary)
          " || true

  benchmark-smoke:
    name: Benchmark smoke (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Setup FastAPI snapshot
        run: python scripts/setup_fastapi_snapshot.py

      - name: Run benchmark smoke test
        run: python scripts/run_large_repo_benchmark.py --mode=smoke --repo=fastapi

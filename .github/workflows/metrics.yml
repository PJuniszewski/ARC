name: Metrics

on:
  push:
    branches: [prod, main]

jobs:
  metrics:
    name: Test metrics & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest tests/ -x -q \
            --ignore=tests/test_external_retrieval.py \
            --ignore=tests/test_fidelity_metrics.py \
            -m "not ml and not llm and not eval" \
            --tb=short \
            --cov=arc --cov-report=term-missing \
            --junit-xml=reports/test-results.xml \
            2>&1 | tee reports/test-output.txt

      - name: Extract coverage percentage
        id: coverage
        run: |
          COV=$(grep -oP 'TOTAL\s+\d+\s+\d+\s+\K\d+' reports/test-output.txt || echo "0")
          echo "pct=$COV" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COV}%"

      - name: Extract test metrics
        if: always()
        run: |
          mkdir -p reports
          python -c "
          import xml.etree.ElementTree as ET, json
          tree = ET.parse('reports/test-results.xml')
          root = tree.getroot()
          suite = root.find('.//testsuite') or root
          metrics = {
              'tests': int(suite.get('tests', 0)),
              'passed': int(suite.get('tests', 0)) - int(suite.get('failures', 0)) - int(suite.get('errors', 0)),
              'failures': int(suite.get('failures', 0)),
              'errors': int(suite.get('errors', 0)),
              'skipped': int(suite.get('skipped', 0)),
              'duration_s': round(float(suite.get('time', 0)), 2),
          }
          metrics['pass_rate'] = round(metrics['passed'] / metrics['tests'] * 100, 1) if metrics['tests'] > 0 else 0
          print(json.dumps(metrics, indent=2))
          with open('reports/metrics.json', 'w') as f:
              json.dump(metrics, f, indent=2)
          "

      - name: Update README coverage badge
        run: python scripts/update_readme_benchmarks.py --coverage ${{ steps.coverage.outputs.pct }}

      - name: Commit updated README
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README coverage badge [skip ci]"
          git push

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics
          path: reports/

  benchmark-smoke:
    name: Benchmark smoke (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Setup FastAPI snapshot
        run: python scripts/setup_fastapi_snapshot.py

      - name: Run benchmark smoke test
        run: python scripts/run_large_repo_benchmark.py --mode=smoke --repo=fastapi

      - name: Update README benchmark tables
        run: python scripts/update_readme_benchmarks.py

      - name: Commit updated README
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README benchmark tables [skip ci]"
          git push
